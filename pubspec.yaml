name: qestak
description: Qestak (قسطك) - offline installment management for a single owner.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  pdf: ^3.11.0
  excel: ^4.0.6
  share_plus: ^10.1.0
  path_provider: ^2.1.0
  file_picker: ^8.1.0
  url_launcher: ^6.3.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
