name: Build Android + iOS
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --org com.qestak --project-name qestak --platforms=android .
          rm -f test/widget_test.dart
          sed -i 's/android:label="qestak"/android:label="قسطك"/' android/app/src/main/AndroidManifest.xml
      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  if (name != "app") {
                      val ext = extensions.findByName("android")
                      val m = ext?.javaClass?.methods?.firstOrNull { it.name == "setCompileSdk" && it.parameterCount == 1 }
                      m?.invoke(ext, 36)
                  }
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          KTS
          else
          cat >> android/build.gradle <<'GRV'

          subprojects { sp ->
              def fix = { p -> if (p.name != 'app' && p.hasProperty('android')) { p.android.compileSdk = 36 } }
              if (sp.state.executed) { fix(sp) } else { sp.afterEvaluate { fix(sp) } }
          }
          GRV
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests (does not block the APK)
        run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk qestak.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qestak-apk
          path: qestak.apk

  ios:
    runs-on: macos-latest
    continue-on-error: true   # an iOS problem must not block the Android APK
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform files
        run: |
          flutter create --org com.qestak --project-name qestak --platforms=ios .
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName قسطك" ios/Runner/Info.plist || true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr qestak-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: qestak-ipa
          path: qestak-unsigned.ipa

  release:
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: قسطك v0.2.${{ github.run_number }}
          body: |
            ملف أندرويد: qestak.apk
            ملف آيفون (غير موقّع، يحتاج Sideloadly أو AltStore): qestak-unsigned.ipa
          files: |
            artifacts/**/*.apk
            artifacts/**/*.ipa
